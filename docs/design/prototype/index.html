<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Continuum Console Prototype</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2318191B'/%3E%3Cpath d='M22.5 9.6A9 9 0 1 0 25 16' fill='none' stroke='%23fff' stroke-width='3' stroke-linecap='round'/%3E%3Ccircle cx='25' cy='16' r='2.4' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:wght@400;600&family=Atkinson+Hyperlegible+Next:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* ═══ Continuum design system v3 ═══
   Colour: ink + red (overdue / out of range). Blue only for the focus ring.
   Type: every size in rem, so the text-size slider scales the whole UI.
   Breakpoints: ≥1280 nav + queue + focus · 1024–1279 queue + focus, nav in a drawer ·
   768–1023 same, narrower queue · <768 one column, bottom tabs, tables become stacked rows. */
:root{
  --bg:#F6F5F2; --surface:#FFFFFF; --sunken:#EFEEEA; --selected:#E9E8E3;
  --line:#E2E0DA; --line-strong:#C4C1B9;
  --ink:#18191B; --ink-2:#45484D; --muted:#5E6167;
  --red:#B42318; --red-bg:#FBEDEB; --focus:#2F5BD3; --on-ink:#FFFFFF;
  --sans:"Atkinson Hyperlegible Next",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Atkinson Hyperlegible Mono",ui-monospace,Menlo,monospace;
  /* type scale */
  --t-display:2.125rem; --t-h1:1.5rem; --t-focus:1.625rem; --t-h2:1rem; --t-lead:1rem;
  --t-body:.875rem; --t-small:.8125rem; --t-label:.75rem; --t-mono:.75rem;
  /* layout */
  --nav-w:216px; --header-h:56px; --queue-w:380px; --row-py:10px; --gutter:40px;
  color-scheme:light;
}
:root[data-density="compact"]{--row-py:6px}
:root[data-theme="dark"]{
  --bg:#121315; --surface:#1A1C1F; --sunken:#0E0F11; --selected:#25272B;
  --line:#2C2F33; --line-strong:#43464C;
  --ink:#ECEDEE; --ink-2:#C2C5CA; --muted:#9A9DA3;
  --red:#FF8F80; --red-bg:#35100C; --focus:#86A6F5; --on-ink:#121315; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:400 var(--t-body)/1.5 var(--sans);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
h1,h2,h3,p{margin:0}
.mono{font-family:var(--mono);font-size:var(--t-mono)}
.muted{color:var(--muted)} .red{color:var(--red)} .strong{font-weight:600}
.small{font-size:var(--t-small)} .tiny{font-size:var(--t-label)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.skip{position:absolute;left:8px;top:-40px;background:var(--ink);color:var(--on-ink);padding:6px 10px;border-radius:4px;z-index:50}
.skip:focus{top:8px}

/* ── Logo ── */
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.logo svg{flex:none}
.logo b{font-size:1rem;font-weight:700;letter-spacing:-.01em}
.logo small{display:block;font-size:var(--t-label);color:var(--muted);font-weight:400;line-height:1.2}

/* ── App shell ── */
.app{display:grid;grid-template-columns:var(--nav-w) minmax(0,1fr);grid-template-rows:var(--header-h) minmax(0,1fr);height:100vh}
.nav{grid-row:1/3;border-right:1px solid var(--line);padding:14px 12px;display:flex;flex-direction:column;gap:2px;background:var(--bg);overflow:auto}
.nav .logo{padding:2px 8px 18px}
.nav a.navlink{display:flex;justify-content:space-between;align-items:center;padding:7px 10px;border-radius:4px;color:var(--ink-2);text-decoration:none}
.nav a.navlink:hover{background:var(--selected)}
.nav a.navlink[aria-current="page"]{background:var(--selected);color:var(--ink);font-weight:600}
.nav a.sub{padding-left:22px;font-size:var(--t-small)}
.nav .navlabel{font-size:var(--t-label);color:var(--muted);padding:14px 10px 4px}
.nav .count{font-family:var(--mono);font-size:var(--t-mono);color:var(--muted)}
.nav .count.red{color:var(--red)}
.nav .spacer{flex:1}
.header{grid-column:2;display:flex;align-items:center;gap:16px;padding:0 24px;border-bottom:1px solid var(--line);background:var(--bg);min-width:0}
.header .menubtn{display:none}
.search{flex:1;max-width:560px;display:flex;align-items:center;gap:10px;height:36px;padding:0 12px;border:1px solid var(--line-strong);border-radius:6px;background:var(--surface);color:var(--muted);cursor:text;text-align:left}
.search span{flex:1}
.hright{margin-left:auto;display:flex;align-items:center;gap:6px}
.iconbtn{all:unset;cursor:pointer;height:34px;min-width:34px;padding:0 8px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;gap:6px;color:var(--ink-2);font-size:var(--t-small)}
.iconbtn:hover{background:var(--selected);color:var(--ink)}
.iconbtn .badge{font-family:var(--mono);font-size:11px;background:var(--red);color:#fff;border-radius:9px;padding:0 5px;line-height:16px}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--selected);display:grid;place-items:center;font-size:var(--t-label);font-weight:700;color:var(--ink)}
.sync{display:flex;align-items:center;gap:6px;font-size:var(--t-label);color:var(--muted);white-space:nowrap}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.sync.off i{background:var(--red)} .sync.off{color:var(--red)}
.main{grid-column:2;min-height:0;display:flex;min-width:0}
.banner{padding:10px 24px;background:var(--red-bg);color:var(--red);font-size:var(--t-small);display:flex;gap:12px;align-items:center;border-bottom:1px solid var(--line)}
.banner.info{background:var(--surface);color:var(--ink)}
.tabbar{display:none}

/* ── Queue + focus (resizable) ── */
.split{display:grid;grid-template-columns:var(--queue-w) 6px minmax(0,1fr);flex:1;min-width:0;min-height:0}
.queue{overflow:auto;background:var(--surface);border-right:1px solid var(--line)}
.divider{cursor:col-resize;background:transparent;position:relative;margin-left:-3px}
.divider:hover,.divider:focus-visible,.divider.drag{background:var(--line-strong)}
.qhead{padding:16px 20px 0;position:sticky;top:0;background:var(--surface);z-index:1;border-bottom:1px solid var(--line)}
.qhead h1{font-size:1.25rem;line-height:1.3;font-weight:700}
.qhead p{margin:2px 0 10px;color:var(--muted);font-size:var(--t-small)}
.scope{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line-strong);border-radius:6px;overflow:hidden;margin-bottom:10px}
.scope button{all:unset;cursor:pointer;text-align:center;padding:6px 4px;font-size:var(--t-small);color:var(--ink-2)}
.scope button+button{border-left:1px solid var(--line-strong)}
.scope button[aria-pressed="true"]{background:var(--ink);color:var(--on-ink);font-weight:600}
.filters{display:flex;gap:2px;margin:0 -6px 8px;flex-wrap:wrap}
.filters button,.tabs button{all:unset;cursor:pointer;padding:5px 8px;border-radius:4px;color:var(--ink-2);font-size:var(--t-small)}
.filters button[aria-pressed="true"],.tabs button[aria-pressed="true"]{background:var(--selected);color:var(--ink);font-weight:600}
.group{padding:14px 20px 6px;font-size:var(--t-label);color:var(--muted);display:flex;justify-content:space-between;align-items:center}
.item{all:unset;box-sizing:border-box;display:grid;grid-template-columns:12px 1fr auto;gap:2px 10px;width:100%;padding:var(--row-py) 20px;cursor:pointer;text-align:left}
.item:hover{background:var(--bg)}
.item[aria-selected="true"]{background:var(--selected)}
.dot{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--line-strong);display:inline-block;flex:none}
.item .dot{grid-column:1;grid-row:1/3;margin-top:.45rem}
.overdue .dot,.dot.over{background:var(--red);border-color:var(--red)}
.dot.done{background:var(--muted);border-color:var(--muted)}
.item .t{font-weight:600;grid-column:2;grid-row:1}
.item .p{grid-column:2/4;grid-row:2;color:var(--muted);font-size:var(--t-small)}
.item .when{grid-column:3;grid-row:1;font-size:var(--t-label);color:var(--muted);white-space:nowrap;margin-top:2px}
.item.overdue .when{color:var(--red)}
.item.quiet{cursor:default} .item.quiet .t{font-weight:400;color:var(--ink-2)}
.item.leaving{animation:leave .22s ease-in forwards}
@keyframes leave{to{opacity:0;transform:translateX(-12px)}}
.skel{height:12px;border-radius:3px;background:var(--sunken);margin:6px 0;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.5}}
.detail{overflow:auto;padding:28px var(--gutter) 120px;min-width:0}
.detail:focus{outline:none}
.detail .back{display:none}
.ctx{font-size:var(--t-small);color:var(--muted)}
.ctx a{color:var(--ink);text-underline-offset:3px;text-decoration-color:var(--line-strong)}
.focus-title{font-size:var(--t-focus);line-height:1.25;margin:6px 0 4px;font-weight:700;max-width:30ch}
.status{font-size:var(--t-body);color:var(--muted);margin-bottom:20px}
.status.red{color:var(--red);font-weight:600}
.why{font-size:var(--t-lead);line-height:1.55;max-width:62ch;margin:0 0 22px}
.block{border-top:1px solid var(--line);padding:16px 0;max-width:760px}
.block h3,.label{font-size:var(--t-label);font-weight:600;color:var(--muted);margin:0 0 10px}
.kv{display:grid;grid-template-columns:140px 1fr;gap:6px 16px;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.cmp{display:grid;grid-template-columns:110px 1fr 1fr;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.cmp>div{padding:9px 12px;border-top:1px solid var(--line);min-width:0;overflow-wrap:anywhere}
.cmp>div:nth-child(-n+3){border-top:0;background:var(--sunken);font-size:var(--t-label);color:var(--muted);font-weight:600}
.cmp .k{color:var(--muted)} .cmp .diff{color:var(--red);font-weight:600}
blockquote{margin:0;padding:2px 0 2px 14px;border-left:2px solid var(--line-strong);color:var(--ink-2);font-size:.9375rem;max-width:62ch}
.big{font-size:1.75rem;font-weight:700;line-height:1.1}
.owner{font-size:var(--t-label);color:var(--muted);margin-top:-12px;margin-bottom:18px}
.owner button{all:unset;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.actions{position:sticky;bottom:0;margin:8px calc(-1*var(--gutter)) 0;padding:16px var(--gutter);background:linear-gradient(to bottom,transparent,var(--bg) 18px);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{height:36px;padding:0 16px;border-radius:4px;border:1px solid var(--line-strong);background:var(--surface);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;white-space:nowrap;font-size:var(--t-body)}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.btn.sm{height:30px;padding:0 10px;font-size:var(--t-small)}
.btn.block{width:100%}
.btn.link{border:0;background:none;padding:0 6px;font-weight:400;color:var(--muted)}
.btn.link:hover{color:var(--ink)}
.btn[disabled]{opacity:.5;cursor:default}
kbd{font-family:var(--mono);font-size:11px;border:1px solid currentColor;border-radius:3px;padding:0 4px;opacity:.7}
.hint{font-size:var(--t-label);color:var(--muted);margin-left:auto}
details{border-top:1px solid var(--line);padding:12px 0;max-width:760px}
summary{cursor:pointer;font-size:var(--t-small);color:var(--muted)}
summary:hover{color:var(--ink)}
.src{font-family:var(--mono);font-size:var(--t-mono);color:var(--muted);line-height:1.9;margin-top:8px;overflow-wrap:anywhere}
.src b{color:var(--ink-2);font-weight:600}
.track{display:flex;gap:20px;font-size:var(--t-small);margin-top:6px;flex-wrap:wrap}
.track span{display:flex;flex-direction:column}
.track small{font-family:var(--mono);font-size:11px;color:var(--muted)}
.track .on{font-weight:600} .track .off{color:var(--muted)}
.live{border:1px solid var(--line);border-radius:6px;padding:14px 16px;margin:6px 0 18px;max-width:760px;background:var(--surface)}
.empty{padding:64px 0;max-width:46ch}
.empty h2{font-size:1.375rem;margin-bottom:8px}

/* ── 30-day clock (transitional care deadlines) ── */
.clock{position:relative;height:118px;margin:4px 56px 0}
.clock .bar{position:absolute;left:0;right:0;top:58px;height:2px;background:var(--line-strong)}
.clock .elapsed{position:absolute;left:0;top:58px;height:2px;background:var(--ink)}
.clock .m{position:absolute;top:53px;width:0}
.clock .m i{position:absolute;left:-6px;width:12px;height:12px;border-radius:50%;border:2px solid var(--line-strong);background:var(--surface)}
.clock .m.done i{background:var(--ink);border-color:var(--ink)}
.clock .m.late i{background:var(--red);border-color:var(--red)}
.clock .m span{position:absolute;left:0;transform:translateX(-50%);text-align:center;white-space:nowrap;font-size:var(--t-label);line-height:1.35}
.clock .m.up span{bottom:12px} .clock .m.down span{top:20px}
.clock .m span b{display:block;font-weight:600;color:var(--ink)}
.clock .m span em{font-style:normal;color:var(--muted)}
.clock .m.late span b,.clock .m.late span em{color:var(--red)}
.clock .today{position:absolute;top:0;bottom:0;width:0;border-left:1px dashed var(--ink)}
.clock .today span{position:absolute;top:0;left:6px;font-size:var(--t-label);font-weight:700;white-space:nowrap}
.clocklist{display:none}

/* ── Pages, panels, tables, forms ── */
.page{flex:1;overflow:auto;padding:28px var(--gutter) 80px;min-width:0}
.page-inner{max-width:1080px}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;margin-bottom:20px;flex-wrap:wrap}
.page-head h1{font-size:var(--t-h1);line-height:1.25;font-weight:700}
.page-head p{color:var(--muted);margin-top:4px;max-width:66ch}
.crumb{font-size:var(--t-small);color:var(--muted);margin-bottom:6px}
.crumb a{color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:6px;overflow-x:auto}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
.panel-head h2{font-size:var(--t-h2);font-weight:600}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:24px;align-items:start}
.stack{display:flex;flex-direction:column;gap:16px}
.list-row{display:grid;grid-template-columns:12px 1fr auto;gap:2px 10px;padding:11px 16px;border-top:1px solid var(--line)}
.list-row:first-child{border-top:0}
.list-row .dot{margin-top:.45rem}
.list-row.click{cursor:pointer} .list-row.click:hover{background:var(--bg)}
.list-row .sub{grid-column:2/4;color:var(--muted);font-size:var(--t-small)}
.section-label{font-size:var(--t-label);font-weight:600;color:var(--muted);padding:14px 16px 6px;border-top:1px solid var(--line)}
.section-label:first-child{border-top:0}
table{border-collapse:collapse;width:100%;font-size:var(--t-small)}
th{text-align:left;font-weight:600;font-size:var(--t-label);color:var(--muted);padding:9px 12px;border-bottom:1px solid var(--line);background:var(--sunken)}
td{padding:var(--row-py) 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr.click{cursor:pointer} tr.click:hover td{background:var(--bg)}
tr.sel td{background:var(--selected)}
tbody tr:last-child td{border-bottom:0}
.tabs{display:flex;gap:4px;margin:0 0 16px;border-bottom:1px solid var(--line);padding-bottom:8px;overflow-x:auto}
.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.input,select,textarea{height:36px;padding:0 10px;border:1px solid var(--line-strong);border-radius:4px;background:var(--surface);max-width:100%}
textarea{height:auto;min-height:96px;padding:8px 10px;width:100%;resize:vertical}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.flabel{font-size:var(--t-label);font-weight:600;color:var(--ink-2)}
.field .help{font-size:var(--t-label);color:var(--muted)}
.field .input,.field select{width:100%}
.form{max-width:680px}
.form fieldset{border:0;border-top:1px solid var(--line);margin:0;padding:18px 0;display:grid;grid-template-columns:1fr 1fr;gap:14px 16px}
.form legend{font-weight:600;padding:0;margin-bottom:4px;float:left;grid-column:1/3}
.form .full{grid-column:1/3}
.check{display:flex;gap:8px;align-items:flex-start}
.check input{margin-top:3px}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:680px;margin-bottom:20px}
.choice button{all:unset;cursor:pointer;border:1px solid var(--line-strong);border-radius:6px;padding:14px 16px;background:var(--surface)}
.choice button[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.choice b{display:block;margin-bottom:2px}
.steps{list-style:none;padding:0;margin:0 0 20px;display:flex;gap:18px;flex-wrap:wrap;font-size:var(--t-small)}
.steps li{display:flex;gap:6px;align-items:center;color:var(--muted)}
.steps li.on{color:var(--ink);font-weight:600}
.steps li span{width:20px;height:20px;border-radius:50%;border:1px solid currentColor;display:grid;place-items:center;font-size:11px}
.steps li.done span{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.chat{display:flex;flex-direction:column;gap:14px;padding:16px}
.msg{max-width:56ch} .msg .who{font-size:var(--t-label);color:var(--muted);margin-bottom:2px}
.msg.me{align-self:flex-end;background:var(--selected);padding:8px 12px;border-radius:6px}
.chatbox{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}
.chatbox .input{flex:1}
.range{display:flex;align-items:center;gap:12px}
.range input{flex:1;max-width:320px;accent-color:var(--ink)}
.field .seg{align-self:flex-start}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:6px;overflow:hidden}
.seg button{all:unset;cursor:pointer;padding:6px 12px;font-size:var(--t-small)}
.seg button+button{border-left:1px solid var(--line-strong)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--on-ink);font-weight:600}
.preview{border:1px solid var(--line);border-radius:6px;padding:12px 16px;background:var(--bg);margin-top:10px;max-width:520px}
.num{font-size:1.5rem;font-weight:700;line-height:1.1}

/* ── Public pages ── */
.public{min-height:100vh;display:flex;flex-direction:column;background:var(--bg)}
.pub-top{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:16px var(--gutter);border-bottom:1px solid var(--line)}
.pub-top nav{display:flex;gap:20px;align-items:center;font-size:var(--t-small)}
.pub-top nav a{text-decoration:none;color:var(--ink-2)}
.pub-wrap{max-width:1120px;width:100%;padding:0 var(--gutter);margin:0 auto}
.hero{display:grid;grid-template-columns:minmax(0,6fr) minmax(0,5fr);gap:48px;padding:72px 0 64px;align-items:start}
.hero .kicker{font-size:var(--t-small);color:var(--muted);margin-bottom:12px}
.hero h1{font-size:var(--t-display);line-height:1.15;font-weight:700;max-width:20ch}
.hero .lead{font-size:1.0625rem;color:var(--ink-2);margin:16px 0 26px;max-width:56ch}
.sec{display:grid;grid-template-columns:minmax(0,4fr) minmax(0,7fr);gap:48px;padding:56px 0;border-top:1px solid var(--line)}
.sec h2{font-size:1.375rem;line-height:1.3;font-weight:700}
.statrow{display:grid;grid-template-columns:160px 1fr;gap:16px;padding:14px 0;border-top:1px solid var(--line)}
.statrow:first-child{border-top:0;padding-top:0}
.statrow b{font-size:1.75rem;line-height:1}
.howrow{display:grid;grid-template-columns:28px 1fr;gap:12px;padding:14px 0;border-top:1px solid var(--line)}
.howrow:first-child{border-top:0;padding-top:0}
.howrow b{display:block}
.rules{display:grid;grid-template-columns:1fr 1fr;gap:0}
.rules div{padding:16px 16px 16px 0;border-top:1px solid var(--line)}
.pub-foot{padding:18px var(--gutter);font-size:var(--t-label);color:var(--muted);border-top:1px solid var(--line);margin-top:auto}


/* ── Landing v5 ── */
.lp3-top{max-width:1240px;margin:0 auto;width:100%;border-bottom:0}
.lp3-wrap{max-width:1240px;margin:0 auto;padding-left:var(--gutter);padding-right:var(--gutter);width:100%}
.lp3-hero{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:56px;align-items:center;padding-top:48px;padding-bottom:72px}
.lp3-hero h1{font-size:clamp(2.25rem,4.2vw,3.5rem);line-height:1.04;letter-spacing:-.03em;max-width:15ch;text-wrap:balance;hyphens:none}
.lp3-sub{font-size:1.125rem;color:var(--ink-2);margin:18px 0 26px;max-width:40ch}
.lp3-video{margin:0;position:relative}
.lp3-video video{display:block;width:100%;aspect-ratio:16/10;object-fit:cover;object-position:top left;border:1px solid var(--line-strong);border-radius:12px;background:var(--surface)}
.lp3-video figcaption{margin-top:8px}
.vidbtn{position:absolute;right:12px;top:12px;height:30px;padding:0 12px;border-radius:15px;border:1px solid var(--line-strong);background:var(--surface);font-size:var(--t-label);font-weight:600}
.lp3 h2{font-size:clamp(1.5rem,2.6vw,2rem);letter-spacing:-.02em;line-height:1.15}
.lp3-play{padding-top:56px;padding-bottom:72px;border-top:1px solid var(--line)}
.pl-grid{display:grid;grid-template-columns:360px minmax(0,1fr);gap:40px;margin-top:24px;align-items:start}
.pl-chart{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px 20px}
.pl-sum{color:var(--muted);font-size:var(--t-small);margin:12px 0 4px}.pl-sum b{color:var(--ink)}
.pl-item{all:unset;cursor:pointer;display:grid;grid-template-columns:14px 1fr;gap:10px;width:100%}
.pl-item:hover b{text-decoration:underline}
.pl-chart .ch-list li{display:block}
.pl-controls{display:flex;align-items:flex-start;gap:14px}
.pl-track{flex:1;min-width:0}
.pl-track input{width:100%;margin:0;accent-color:var(--ink);height:28px}
.pl-controls #plDate{padding-top:6px;white-space:nowrap}
.pl-ticks{position:relative;height:18px}
.pl-ticks button{all:unset;cursor:pointer;position:absolute;transform:translateX(-50%);font-family:var(--mono);font-size:11px;color:var(--muted)}
.pl-ticks button.on{color:var(--ink);font-weight:600}
.pl-ev .evrow,.pl-ev .cmp,.pl-ev .track{font-size:var(--t-body)}
.pl-cap{font-size:clamp(1.25rem,2.2vw,1.625rem);line-height:1.3;font-weight:600;letter-spacing:-.01em;margin:28px 0 18px;min-height:2.6em;max-width:28ch}
.pl-ev{max-width:560px}
.lp3-try{padding-top:56px;padding-bottom:72px;border-top:1px solid var(--line)}
.try-head{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;margin-bottom:20px}
.try-steps{display:flex;gap:22px;margin:0;padding:0;list-style:none;counter-reset:s;font-size:var(--t-small);flex-wrap:wrap}
.try-steps li{counter-increment:s;display:flex;gap:8px;align-items:center}
.try-steps li:before{content:counter(s);width:22px;height:22px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-size:11px;font-weight:700}
.try-frame{border:1px solid var(--line-strong);border-radius:12px;overflow:hidden;height:680px;background:var(--surface)}
.try-frame iframe{width:100%;height:100%;border:0;display:block}
.lp3-rules{padding-top:56px;padding-bottom:56px;border-top:1px solid var(--line)}
.rgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-top:24px}
.rule{display:flex;flex-direction:column;gap:4px}
.rule b{margin-top:14px}.rule span{color:var(--ink-2);font-size:var(--t-small)}
.mini{height:150px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;position:relative;overflow:hidden;font-size:var(--t-small);display:flex;flex-direction:column;justify-content:center;gap:10px}
.mini .evrow{border:0;padding:0;background:none}
.mini .bub{align-self:flex-start;background:var(--selected);border-radius:8px;padding:5px 10px}
.mini .tag{color:var(--muted)}
.r1 .bub{animation:r1b 6s infinite}.r1 .tag{animation:r1t 6s infinite}
@keyframes r1b{0%,15%{opacity:0;transform:translateY(6px)}25%,100%{opacity:1;transform:none}}
@keyframes r1t{0%,40%{opacity:0}50%,100%{opacity:1}}
.segs{display:flex;gap:4px}.segs i{flex:1;height:10px;border-radius:2px;border:1px solid var(--line-strong)}
.r2 .segs i:nth-child(1){animation:f1 6s infinite}.r2 .segs i:nth-child(2){animation:f2 6s infinite}.r2 .segs i:nth-child(3){animation:f3 6s infinite}.r2 .segs i:nth-child(4){animation:f4 6s infinite}.r2 .segs i:nth-child(5){animation:f5 6s infinite}
@keyframes f1{0%,8%{background:none}12%,100%{background:var(--ink)}}
@keyframes f2{0%,18%{background:none}22%,100%{background:var(--ink)}}
@keyframes f3{0%,28%{background:none}32%,100%{background:var(--ink)}}
@keyframes f4{0%,38%{background:none}42%,55%{background:var(--red)}62%,100%{background:var(--ink)}}
@keyframes f5{0%,70%{background:none}76%,100%{background:var(--ink)}}
.r2 .lbl{animation:r1t 6s infinite}
.r3 .track{margin:0}.r3 .c{color:var(--muted);animation:r3c 6s infinite}
@keyframes r3c{0%,55%{color:var(--muted);font-weight:400}62%,100%{color:var(--ink);font-weight:600}}
.r3 .bub{animation:r3b 6s infinite}
@keyframes r3b{0%,35%{opacity:0}45%,100%{opacity:1}}
.r4{flex-direction:row;flex-wrap:wrap;align-items:center;align-content:center}
.r4 .arr,.r4 span:nth-child(3){animation:r1b 6s infinite}
.r4 .cf{animation:r4c 6s infinite}
@keyframes r4c{0%,50%{opacity:0}58%{opacity:1;transform:scale(1.06)}64%,100%{opacity:1;transform:none}}
.lp3-nums{display:flex;gap:48px;flex-wrap:wrap;padding-top:40px;padding-bottom:40px;border-top:1px solid var(--line)}
.lp3-nums div{display:flex;align-items:baseline;gap:12px}
.lp3-nums b{font-size:2rem;letter-spacing:-.03em}
.lp3-nums span{color:var(--ink-2);font-size:var(--t-small);max-width:22ch}
.lp3-nums sup{font-family:var(--mono)}
.lp3-built{padding-top:18px;padding-bottom:18px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);font-size:var(--t-small);display:flex;gap:10px;flex-wrap:wrap}
.lp3-foot{padding-top:32px;padding-bottom:40px;display:grid;grid-template-columns:1fr auto;gap:16px 24px;align-items:center}
.lp3-foot>div:first-child{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.lp3-foot .fn{grid-column:1/3;margin:8px 0 0}
@media (prefers-reduced-motion:reduce){.mini *{animation:none!important}}
@media (max-width:1023px){.lp3-hero,.pl-grid{grid-template-columns:1fr}.rgrid{grid-template-columns:1fr 1fr}.try-frame{height:620px}}
@media (max-width:767px){
 .lp3-hero{gap:28px;padding-top:28px;padding-bottom:48px}
 .pl-controls{flex-wrap:wrap}.pl-track{flex-basis:100%;order:3}.pl-ticks .minor{display:none}
 .pl-chart{order:2}.pl-stage{order:1}.pl-grid{gap:20px}
 .lp3-video video{aspect-ratio:390/760;max-width:300px;margin:0 auto}.lp3-video figcaption{text-align:center}
 .pl-cap{margin-top:16px}
 .rgrid{grid-template-columns:1fr}.mini{height:120px}
 .try-frame{height:640px}
 .lp3-nums{flex-direction:column;gap:16px}
 .lp3-foot{grid-template-columns:1fr}.lp3-foot .fn{grid-column:1}
}

/* ── Landing v4: one patient's 30 days ── */
.lp2 .lp2-top{max-width:1200px;margin:0 auto;width:100%;border-bottom:0}
.lp2-grid{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:64px;max-width:1200px;margin:0 auto;padding:0 var(--gutter);width:100%}
.lp2-hero{padding:56px 0 40px;border-bottom:1px solid var(--line)}
.lp2-for{font-weight:600;color:var(--ink-2);margin-bottom:18px}
.lp2-hero h1{font-size:clamp(2.25rem,4.6vw,3.75rem);line-height:1.05;letter-spacing:-.03em;font-weight:700;max-width:17ch}
.lp2-sub{font-size:1.125rem;color:var(--ink-2);max-width:52ch;margin-top:22px}
.day{display:grid;grid-template-columns:96px minmax(0,1fr);gap:24px;padding:56px 0;border-bottom:1px solid var(--line);transition:opacity .25s}
.day.future{opacity:.4}
.day-n span{display:block;font-size:var(--t-small);color:var(--muted)}
.day-n b{font-size:3.25rem;line-height:1;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.day-c h2{font-size:clamp(1.375rem,2.4vw,1.875rem);line-height:1.2;letter-spacing:-.02em;margin:6px 0 10px}
.day-c>p{font-size:1.0625rem;color:var(--ink-2);max-width:54ch}
.ev{margin-top:18px;max-width:560px}
.ev.mono{font-size:var(--t-mono);color:var(--muted);border-left:2px solid var(--line-strong);padding-left:12px}
.ev blockquote{margin-top:12px}
.evrow{display:grid;grid-template-columns:12px 1fr auto;gap:2px 10px;align-items:baseline;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:12px 14px}
.evrow .muted{grid-column:2/4}
.day-c>p.note{font-size:var(--t-small);color:var(--muted);margin-top:16px;max-width:54ch}
.note sup,.fn{font-family:var(--mono)}
.lp2-chart{position:sticky;top:88px;align-self:start;margin-top:56px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px}
.ch-head{display:flex;justify-content:space-between;align-items:flex-start}
.ch-day{text-align:right}.ch-day span{display:block}.ch-day b{font-size:2.5rem;line-height:1;letter-spacing:-.03em}
.ch-bar{height:3px;background:var(--line);margin:14px 0 8px;border-radius:2px;overflow:hidden}
.ch-bar i{display:block;height:100%;background:var(--ink);transition:width .3s}
.ch-sum{color:var(--muted);margin-bottom:6px}
.ch-list{list-style:none;margin:0;padding:0}
.ch-list li{display:grid;grid-template-columns:14px 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.ch-list li .dot{margin-top:6px}
.ch-list .dot.ink{background:var(--ink);border-color:var(--ink)}
.ch-list b{display:block;font-weight:600}
.ch-list small{display:block;font-size:var(--t-small);color:var(--muted)}
.ch-list li.done b{color:var(--ink-2)}
.ch-list li.pend .dot{background:linear-gradient(90deg,var(--ink) 50%,transparent 50%);border-color:var(--ink)}
.lp2-notes{padding:64px 0 72px}
.lp2-notes h2{font-size:1.5rem;letter-spacing:-.02em}
.fn{font-size:12px;color:var(--muted);padding-left:18px;margin:14px 0 36px;line-height:1.7}
.fn i{font-style:italic}
.lp2-cols{display:grid;grid-template-columns:1fr 1fr;gap:28px 40px}
.lp2-cols h3{font-size:1rem;margin:0 0 6px;padding-top:12px;border-top:2px solid var(--ink)}
.lp2-cols p{color:var(--ink-2);font-size:var(--t-body)}
.lp2-foot{max-width:1200px;margin:0 auto;width:100%;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
.lp2-foot span:first-child{display:flex;align-items:center;gap:8px;color:var(--ink);font-weight:600}
@media (prefers-reduced-motion:reduce){.day,.ch-bar i{transition:none}}
@media (max-width:1023px){.lp2-grid{grid-template-columns:minmax(0,1fr) 300px;gap:32px}}
@media (max-width:767px){
  .lp2-grid{grid-template-columns:1fr;gap:0}
  .lp2-chart{order:-1;position:sticky;top:0;z-index:5;margin:0 calc(-1*var(--gutter));border-radius:0;border-width:0 0 1px;padding:10px var(--gutter)}
  .lp2-chart .ch-list{display:none}
  .lp2-chart .ch-head .tiny{display:none}
  .ch-day b{font-size:1.5rem}
  .ch-bar{margin:8px 0 4px}
  .lp2-hero{padding:32px 0 28px}
  .day{grid-template-columns:1fr;gap:6px;padding:36px 0}
  .day-n{display:flex;align-items:baseline;gap:8px}.day-n b{font-size:2rem}
  .lp2-cols{grid-template-columns:1fr}
}

/* ── Landing ── */
.lp-eyebrow{font-size:1rem;color:var(--ink-2);font-weight:600;margin-bottom:16px}
.btn.ghost{background:transparent;color:var(--bg);border-color:var(--muted)}
.lp-roles{padding:80px var(--gutter) 8px}
.lp-roles h2,.lp-hood h2,.lp-faq h2{font-size:1.5rem;letter-spacing:-.02em;margin-bottom:20px}
.lp-rgrid{display:grid;grid-template-columns:repeat(3,1fr);border-top:2px solid var(--ink)}
.lp-rgrid div{padding:18px 24px 0 0}
.lp-rgrid b{font-size:1.125rem}
.lp-rgrid p{color:var(--ink-2);margin-top:6px;max-width:32ch}
.lp-hood{padding:24px var(--gutter) 40px}
.lp-hgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.lp-hgrid>div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px 22px}
.lp-hgrid h3{font-size:1.0625rem;margin:0 0 12px}
.lp-hgrid dl{margin:0;display:grid;gap:10px}
.lp-hgrid dt{font-weight:600;font-size:var(--t-small)}
.lp-hgrid dd{margin:0;color:var(--ink-2);font-size:var(--t-small)}
.lp-faq{padding:48px var(--gutter) 88px}
.lp-faq details{max-width:760px!important}
.lp-faq details{max-width:none;padding:16px 0}
.lp-faq summary{font-size:1.0625rem;color:var(--ink);font-weight:600}
.lp-faq details p{margin-top:8px;color:var(--ink-2);max-width:64ch}
@media (max-width:1023px){.lp-hgrid{grid-template-columns:1fr}}
@media (max-width:767px){.lp-rgrid{grid-template-columns:1fr}.lp-rgrid div{padding:16px 0 0}.lp-roles{padding-top:56px}.lp-faq{padding-bottom:56px}}

.lp .pub-top{border-bottom:0;max-width:1200px;margin:0 auto;width:100%}
.lp .pub-wrap{max-width:1200px}
.btn.lg{height:46px;padding:0 22px;font-size:1rem;border-radius:6px}
.btn.inv{background:var(--bg);color:var(--ink);border-color:var(--bg)}
.lp-hero{text-align:center;padding:72px var(--gutter) 40px}
.lp-hero h1{font-size:clamp(2.25rem,5.4vw,4rem);line-height:1.04;letter-spacing:-.03em;font-weight:700;max-width:19ch;margin:0 auto;text-wrap:balance}

.lp-sub{font-size:1.125rem;line-height:1.5;color:var(--ink-2);max-width:48ch;margin:20px auto 28px}
.lp-cta{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:10px}
.lp-shot{position:relative;border:1px solid var(--line-strong);border-radius:12px;overflow:hidden;background:var(--surface);box-shadow:0 30px 80px -40px rgba(0,0,0,.35);aspect-ratio:1280/760}
.lp-shot iframe{position:absolute;top:0;left:0;width:1280px;height:760px;border:0;transform-origin:0 0;pointer-events:none}
.lp-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:0;padding:72px var(--gutter) 24px}
.lp-stats div{padding:0 28px;border-left:1px solid var(--line)}
.lp-stats div:first-child{border-left:0;padding-left:0}
.lp-stats b{display:block;font-size:clamp(2.25rem,4vw,3.25rem);line-height:1;letter-spacing:-.03em;margin-bottom:10px}
.lp-stats span{display:block;font-size:1rem;color:var(--ink-2);max-width:26ch}
.lp-stats small{display:block;margin-top:8px;font-family:var(--mono);font-size:11px;color:var(--muted)}
.lp-feat{padding:64px var(--gutter) 24px;display:flex;flex-direction:column;gap:72px}
.lp-f{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:56px;align-items:center}
.lp-f.rev .lp-ft{order:2}
.lp-k{font-size:var(--t-small);color:var(--muted);font-weight:600}
.lp-ft h2{font-size:clamp(1.5rem,2.6vw,2rem);line-height:1.15;letter-spacing:-.02em;margin:6px 0 10px}
.lp-ft p{font-size:1.0625rem;color:var(--ink-2);max-width:36ch}
.lp-vis{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:24px}
.lp-vis .clock{margin:0 48px}
.lp-call blockquote{font-size:1rem}
.lp-how{padding:88px var(--gutter) 72px}
.lp-how h2{font-size:1.5rem;letter-spacing:-.02em;margin-bottom:24px}
.lp-how ol{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,1fr);border-top:2px solid var(--ink)}
.lp-how li{padding:16px 20px 0 0;display:flex;flex-direction:column;gap:4px}
.lp-how li .mono{color:var(--muted)}
.lp-how li b{font-size:1.0625rem}
.lp-end{background:var(--ink);color:var(--bg);padding:64px 0}
.lp-end .pub-wrap{display:flex;justify-content:space-between;align-items:center;gap:24px;flex-wrap:wrap;padding:0 var(--gutter)}
.lp-end h2{font-size:clamp(1.5rem,3vw,2.25rem);letter-spacing:-.02em}
.lp .pub-foot{border-top:0}
.lp .pub-foot span:first-child{display:flex;align-items:center;gap:8px;font-weight:600;color:var(--ink)}
@media (max-width:767px){
  .lp-hero{text-align:left;padding:36px var(--gutter) 28px}
  .lp-hero h1{margin:0}.lp-sub{margin:16px 0 22px}.lp-cta{justify-content:flex-start}
  .lp-shot{aspect-ratio:390/720;max-width:340px;margin:0 auto;border-radius:20px}
  .lp-shot iframe{width:390px;height:720px}
  .lp-stats{grid-template-columns:1fr;gap:28px;padding:48px var(--gutter) 8px}
  .lp-stats div{border-left:0;padding:0}
  .lp-f,.lp-f.rev{grid-template-columns:1fr;gap:20px}.lp-f.rev .lp-ft{order:0}
  .lp-feat{gap:48px;padding-top:40px}
  .lp-vis{padding:16px}.lp-vis .clock{display:none}.lp-vis .clocklist{display:block}
  .lp-how{padding:56px var(--gutter) 48px}.lp-how ol{grid-template-columns:1fr 1fr;gap:20px 0}
}

.auth{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);min-height:100vh}
.auth-left{padding:32px 72px;display:flex;flex-direction:column}
.auth-form{margin:auto 0;width:100%;max-width:400px;display:flex;flex-direction:column;gap:14px;padding:40px 0}
.auth-form h1{font-size:var(--t-h1)}
.auth-right{background:var(--surface);border-left:1px solid var(--line);padding:140px 64px 40px}
.divline{display:flex;align-items:center;gap:10px;font-size:var(--t-label);color:var(--muted)}
.divline:before,.divline:after{content:"";flex:1;height:1px;background:var(--line)}
.err{color:var(--red);font-size:var(--t-small)}

/* ── Overlays ── */
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--on-ink);border-radius:6px;padding:10px 12px 10px 16px;display:flex;gap:16px;align-items:center;font-size:var(--t-body);opacity:0;pointer-events:none;transition:opacity .15s;z-index:40;max-width:calc(100vw - 32px)}
.toast.show{opacity:1;pointer-events:auto}
.toast button{all:unset;cursor:pointer;font-weight:700;text-decoration:underline;text-underline-offset:3px}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.2);opacity:0;pointer-events:none;transition:opacity .15s;z-index:19}
.scrim.show{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100vw);background:var(--surface);border-left:1px solid var(--line);transform:translateX(100%);transition:transform .18s ease-out;overflow:auto;padding:24px 28px;z-index:20}
.drawer.left{left:0;right:auto;border-left:0;border-right:1px solid var(--line);transform:translateX(-100%);width:min(280px,86vw);padding:14px 12px;display:flex;flex-direction:column;gap:2px}
.drawer.show{transform:none}
.drawer h2{font-size:1.375rem}
.close{all:unset;cursor:pointer;float:right;color:var(--muted);font-size:var(--t-small)}
.palette{position:fixed;left:50%;top:12vh;transform:translateX(-50%);width:min(620px,calc(100vw - 24px));background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:0 18px 48px -12px rgba(0,0,0,.35);z-index:30;display:none;overflow:hidden}
.palette.show{display:block}
.palette input{all:unset;box-sizing:border-box;width:100%;padding:14px 16px;font-size:1rem;border-bottom:1px solid var(--line)}
.palette .res{max-height:52vh;overflow:auto;padding:6px 0}
.palette .grp{font-size:var(--t-label);color:var(--muted);padding:8px 16px 4px}
.palette .r{display:flex;justify-content:space-between;gap:12px;padding:8px 16px;cursor:pointer}
.palette .r[aria-selected="true"]{background:var(--selected)}
.menu{position:fixed;top:calc(var(--header-h) - 4px);right:16px;background:var(--surface);border:1px solid var(--line);border-radius:6px;box-shadow:0 12px 32px -10px rgba(0,0,0,.3);z-index:30;min-width:240px;padding:6px 0;display:none}
.menu.show{display:block}
.menu a,.menu button{all:unset;box-sizing:border-box;display:block;width:100%;padding:8px 14px;cursor:pointer}
.menu a:hover,.menu button:hover{background:var(--selected)}
.menu .who{padding:8px 14px 10px;border-bottom:1px solid var(--line);margin-bottom:4px}
.help{position:fixed;inset:0;display:none;place-items:center;background:rgba(0,0,0,.25);z-index:35}
.help.show{display:grid}
.help>div{background:var(--surface);border-radius:6px;padding:20px 24px;min-width:300px}
.help dl{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:12px 0 0}
.help dt{font-family:var(--mono);font-size:var(--t-mono)}
@media (prefers-reduced-motion:reduce){.drawer,.scrim,.toast{transition:none}.item.leaving,.skel{animation:none}}

/* ── Breakpoints ── */
@media (max-width:1279px){
  .app{grid-template-columns:minmax(0,1fr)}
  .nav{display:none}
  .header,.main{grid-column:1}
  .header .menubtn{display:inline-flex}
  .cols{grid-template-columns:minmax(0,1fr) 280px}
}
@media (max-width:1023px){
  :root{--gutter:24px}
  .split{grid-template-columns:320px 0 minmax(0,1fr)}
  .divider{display:none}
  .cols{grid-template-columns:1fr}
  .hero,.sec{grid-template-columns:1fr;gap:24px}
}
@media (max-width:767px){
  :root{--gutter:16px;--header-h:52px;--t-focus:1.375rem;--t-display:1.75rem}
  .app{grid-template-rows:var(--header-h) minmax(0,1fr) 56px}
  .header{padding:0 12px;gap:8px}
  .search span.long,.sync,.hide-m{display:none}
  .search{flex:0 0 auto;max-width:none;width:36px;padding:0;justify-content:center;border:0;background:none}
  .header .menubtn{display:none}
  .logo-m{display:flex}
  .split{grid-template-columns:1fr}
  .split .detail{display:none}
  .split.showdetail .queue{display:none}
  .split.showdetail .detail{display:block}
  .detail .back{display:inline-flex;margin-bottom:12px}
  .queue{border-right:0}
  .tabbar{display:grid;grid-template-columns:repeat(4,1fr);grid-column:1;border-top:1px solid var(--line);background:var(--surface)}
  .tabbar a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;color:var(--muted);text-decoration:none}
  .tabbar a[aria-current="page"]{color:var(--ink);font-weight:700}
  .tabbar a b{font-family:var(--mono);font-size:11px;font-weight:600}
  .actions{position:sticky;bottom:0;background:var(--bg);border-top:1px solid var(--line);margin-top:16px}
  .actions .btn{flex:1}
  .hint{display:none}
  .kv{grid-template-columns:110px 1fr}
  .cmp{grid-template-columns:84px 1fr 1fr;font-size:var(--t-small)}
  table.stacked thead{display:none}
  table.stacked tr{display:block;border-bottom:1px solid var(--line);padding:8px 0}
  table.stacked td{display:flex;justify-content:space-between;gap:16px;border:0;padding:4px 14px;text-align:right}
  table.stacked td::before{content:attr(data-label);color:var(--muted);font-weight:600;font-size:var(--t-label);text-align:left}
  table.stacked td:first-child{text-align:left}
  table.stacked td:first-child::before{content:none}
  table.stacked td:first-child{justify-content:flex-start;gap:8px;align-items:center;font-size:var(--t-body)}
  table.stacked td.mono::before{font-family:var(--sans)}
  .clock{display:none} .clocklist{display:block}
  .form fieldset,.choice,.rules{grid-template-columns:1fr}
  .form legend,.form .full{grid-column:1}
  .auth{grid-template-columns:1fr} .auth-right{display:none} .auth-left{padding:20px 16px}
  .pub-top nav a.hide-m{display:none}
  .hero{padding:40px 0}
  .statrow{grid-template-columns:90px 1fr}
  .toast{bottom:68px}
}

function save(){ try{ localStorage.setItem("cx.prefs",JSON.stringify(prefs)); }catch(_){} }
function applyPrefs(){ const r=document.documentElement;
  r.style.fontSize=(16*(prefs.text||100)/100)+"px";

  const t=prefs.theme||"system"; r.dataset.theme = t==="system" ? (matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light") : t;

let current=(location.hash&&location.hash.length>2)?location.hash:"#/welcome";
function route(){ return current.slice(1).split("/").filter(Boolean); }
function go(h){ current=h; try{ if(location.hash!==h) history.pushState(null,"",h); }catch(_){} closeAll(); S.mDetail=false; render(); const m=document.querySelector(".page,.detail,.queue"); if(m) m.scrollTop=0; }
window.addEventListener("popstate",()=>{ if(location.hash){ current=location.hash; render(); } });
document.addEventListener("click",e=>{ const a=e.target.closest('a[href^="#/"]'); if(a){ e.preventDefault(); go(a.getAttribute("href")); } },true);
const PUBLIC=["welcome","login","sso","invite","request","forgot"];

function render(){
  const r=route(), root=$("#root");
  if(PUBLIC.includes(r[0])){ root.innerHTML=publicPage(r[0]); fitShot(); initStory(); initLanding(); return; }
  let page="", split=false;
  if(r[0]==="queue"){ split=true; page=`<div class="split ${S.mDetail?"showdetail":""}" id="split"><section class="queue" aria-label="Queue">${queueHTML()}</section><div class="divider" id="divider" role="separator" aria-orientation="vertical" aria-label="Resize queue" aria-valuemin="300" aria-valuemax="560" aria-valuenow="${prefs.qw||380}" tabindex="0"></div><main class="detail" id="content" tabindex="-1">${S.state==="loading"?skeleton():focusHTML()}</main></div>`; }
  else if(r[0]==="patients"&&r[1]) page=pageWrap(patientPage(r[1]));
  else if(r[0]==="patients") page=pageWrap(patientsPage());
  else if(r[0]==="new") page=pageWrap(newPage());
  else if(r[0]==="activity") page=pageWrap(activityPage(r[1]||"calls"));
  else if(r[0]==="team") page=pageWrap(teamPage());
  else if(r[0]==="settings") page=pageWrap(settingsPage());
  else page=pageWrap(`<div class="empty"><h2>This page doesn't exist.</h2><p class="muted">The link may be old. <a href="#/queue">Go to Needs you</a></p></div>`);
  root.innerHTML=`<div class="app">${nav(r)}${header()}<div class="main" style="flex-direction:column">${banners()}<div style="display:flex;flex:1;min-height:0">${page}</div></div>${tabbar(r)}</div>`;
  bindDivider();
}
function fitShot(){ const box=document.getElementById("lpShot"); if(!box) return; const f=box.querySelector("iframe"); const base=innerWidth<768?390:1280; f.style.transform=`scale(${box.clientWidth/base})`; }

function pageWrap(inner){ return `<main class="page" id="content" tabindex="-1"><div class="page-inner">${S.state==="loading"?skeleton():inner}</div></main>`; }
function skeleton(){ return `<div aria-busy="true" aria-label="Loading">${[60,90,75,40,85,70].map(w=>`<div class="skel" style="width:${w}%"></div>`).join("")}</div>`; }

let storyCur=-1;
function updateStory(){
  const ch=document.getElementById("storyChart"); if(!ch) return;
  const days=[...document.querySelectorAll(".day")]; const mid=innerHeight*0.55;
  let idx=0; days.forEach((d,k)=>{ if(d.getBoundingClientRect().top<mid) idx=k; });
  if(idx===storyCur) return; storyCur=idx; ch.innerHTML=storyChart(idx);
  days.forEach((d,k)=>{ d.classList.toggle("future",k>idx); });
}
function initStory(){ storyCur=-1; updateStory(); }

let plTimer=null;
function setDay(d){ const r=$("#plRange"); if(!r) return; d=Math.max(0,Math.min(30,+d)); r.value=d; r.setAttribute("aria-valuetext","Day "+d); const pc=playChart(d);
  $("#plDay").textContent=d; $("#plList").innerHTML=pc.list; $("#plCap").textContent=pc.cap; $("#plEv").innerHTML=pc.ev; $("#plDate").textContent=pc.date;
  document.querySelectorAll(".pl-ticks button").forEach(b=>b.classList.toggle("on",+b.dataset.jump<=d)); }
function stopPlay(){ clearInterval(plTimer); plTimer=null; const b=$("#plPlay"); if(b){ b.textContent="▶ Play"; b.setAttribute("aria-label","Play"); } }
function startPlay(){ const r=$("#plRange"); if(+r.value>=30) setDay(0); const b=$("#plPlay"); b.textContent="❚❚ Pause"; b.setAttribute("aria-label","Pause");
  plTimer=setInterval(()=>{ const v=+$("#plRange").value+1; setDay(v); if(v>=30) stopPlay(); },320); }
function initLanding(){
  const v=$("#heroVid"); if(!v) return;
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  if(innerWidth<768){ v.poster="landing/hero-phone-poster.png"; v.innerHTML='<source src="landing/hero-phone.mp4" type="video/mp4">'; v.load(); }
  if(!reduce){ v.play().catch(()=>{}); } else { $("#vidBtn").textContent="Play"; }
  $("#vidBtn").onclick=()=>{ if(v.paused){ v.play(); $("#vidBtn").textContent="Pause"; } else { v.pause(); $("#vidBtn").textContent="Play"; } };
  $("#plRange").oninput=e=>{ stopPlay(); setDay(e.target.value); };
  $("#plPlay").onclick=()=>{ plTimer?stopPlay():startPlay(); };
  if(!reduce&&"IntersectionObserver" in window){ const o=new IntersectionObserver(es=>{ if(es[0].isIntersecting){ o.disconnect(); if(+$("#plRange").value===0) startPlay(); } },{threshold:.6}); o.observe($("#play")); }
}

function scoped(scope){ if(S.role==="clinician") return queue.filter(i=>i.clinical);
  if(scope==="mine") return queue.filter(i=>i.owner===S.me);
  if(scope==="unassigned") return queue.filter(i=>!i.owner);
  return queue.filter(i=>!i.clinical||S.role!=="coordinator"?true:true); }
const QF={all:()=>true,overdue:i=>i.overdue,verify:i=>i.cat==="verify",system:i=>i.cat==="system"};
function visible(){ return scoped(S.scope).filter(QF[S.qf]); }
function queueHTML(){
  if(S.state==="loading") return `<div class="qhead"><h1>Needs you</h1><p>Loading…</p></div><div style="padding:16px 20px">${skeleton()}</div>`;
  const v=visible(); if(S.sel>=v.length) S.sel=Math.max(0,v.length-1);
  const clin=S.role==="clinician";
  const over=v.filter(i=>i.overdue).length;
  const sc=(k,l)=>`<button data-scope="${k}" aria-pressed="${S.scope===k}">${l} · ${scoped(k).length}</button>`;
  const f=(k,l)=>`<button data-qf="${k}" aria-pressed="${S.qf===k}">${l} <span class="mono muted">${scoped(S.scope).filter(QF[k]).length}</span></button>`;
  let h=`<div class="qhead"><h1>${clin?"Results to review":"Needs you"}</h1><p>${v.length?`${v.length} items${over?` · <span class="red">${over} overdue</span>`:""} · overdue first, then by deadline`:"Nothing waiting"}</p>
    ${clin?"":`<div class="scope" role="group" aria-label="Whose items">${sc("mine","Mine")}${sc("team","Team")}${sc("unassigned","Unassigned")}</div>`}
    ${clin?"":`<div class="filters">${f("all","All")}${f("overdue","Overdue")}${f("verify","To verify")}${f("system","System")}</div>`}</div>`;
  h+=v.map((it,i)=>`<button class="item ${it.overdue?"overdue":""}" role="option" aria-selected="${i===S.sel}" data-i="${i}"><span class="dot"></span><span class="t">${it.title}</span><span class="when">${it.when}</span><span class="p">${P(it.pt).name}${S.scope!=="mine"?` · ${it.owner?people[it.owner].name:"Unassigned"}`:""}</span></button>`).join("");
  if(!v.length) h+=`<div style="padding:20px" class="muted small">Nothing here. ${S.scope==="mine"?"Check Team or Unassigned for work you could pick up.":""}</div>`;
  if(S.qf==="all"&&!clin){
    h+=`<div class="group"><span>Waiting on others · ${waiting.length}</span><button class="btn link" data-toggle="waiting">${S.open.waiting?"Hide":"Show"}</button></div>`;
    if(S.open.waiting) h+=waiting.map(w=>`<div class="item quiet"><span class="dot"></span><span class="t">${w.title}</span><span class="when">${w.when}</span><span class="p">${P(w.pt).name} · ${w.note}</span></div>`).join("");
    h+=`<div class="group"><span>Done today · ${done.length}</span><button class="btn link" data-toggle="done">${S.open.done?"Hide":"Show"}</button></div>`;
    if(S.open.done) h+=done.map(w=>`<div class="item quiet"><span class="dot done"></span><span class="t">${w.title}</span><span class="when">${w.when}</span><span class="p">${P(w.pt).name}</span></div>`).join("");
  }
  return h;
}

function toast(msg,canUndo=true){ $("#toastMsg").textContent=msg; $("#undo").style.display=canUndo?"":"none"; $("#toast").classList.add("show"); clearTimeout(toast.t); toast.t=setTimeout(()=>$("#toast").classList.remove("show"),6000); }
function removeCurrent(msg,dest){
  const it=visible()[S.sel]; if(!it) return;
  const idx=queue.indexOf(it), el=document.querySelector(`.item[data-i="${S.sel}"]`);
  last={it,idx,dest};
  const finish=()=>{ queue.splice(idx,1);
    if(dest==="done") done.unshift({pt:it.pt,title:it.title,when:NOW,note:msg});
    if(dest==="waiting") waiting.unshift({pt:it.pt,title:it.title,when:"now",note:msg});
    S.mDetail=false; render(); toast(msg); };
  if(el&&!matchMedia("(prefers-reduced-motion: reduce)").matches){ el.classList.add("leaving"); setTimeout(finish,220);} else finish();
}
function undo(){ if(!last) return; queue.splice(last.idx,0,last.it);
  if(last.dest==="done") done.shift(); if(last.dest==="waiting") waiting.shift();
  S.qf="all"; S.sel=Math.max(0,visible().indexOf(last.it)); last=null; $("#toast").classList.remove("show"); render(); }
function act(which){
  if(S.state==="offline"){ toast("You're offline. Actions are paused until we reconnect.",false); return; }
  const it=visible()[S.sel]; if(!it) return;
  const a=which==="primary"?it.primary:it.secondary[+which.slice(1)];
  if(a.kind==="call"){
    const live=$("#live");
    const tr=(s)=>`<div class="track">${["Intended","Sent","Confirmed"].map((n,i)=>`<span class="${i===s?"on":"off"}">${n}<small>${i<=s&&i<2?NOW+(i?":07":":05"):i===2?"after the transcript":"—"}</small></span>`).join("")}</div>`;
    live.innerHTML=`<div class="live" role="status"><b>Calling ${a.to}</b>${tr(0)}</div>`;
    document.querySelectorAll(".actions .btn").forEach(b=>b.disabled=true);
    setTimeout(()=>{ live.innerHTML=`<div class="live" role="status"><b>Calling ${a.to}</b>${tr(1)}</div>`; },900);
    setTimeout(()=>removeCurrent(`Call to ${a.to} sent. Comes back here if no transcript by 09:30.`,"waiting"),2200); return;
  }
  if(a.kind==="snooze"){ $("#live").innerHTML=`<div class="live"><b>Snooze until</b><div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap">${["Later today 14:00","Tomorrow 08:00","Mon Nov 16 08:00"].map(t=>`<button class="btn sm" data-snooze="${t}">${t}</button>`).join("")}</div><div class="field" style="margin-top:10px"><label for="snr">Reason (shown to the team)</label><input class="input" id="snr" placeholder="e.g. Clinic said they'll call back tomorrow"></div></div>`; return; }
  if(a.kind==="log"||a.kind==="reject"){
    $("#live").innerHTML=`<div class="live"><label class="strong" for="note">${a.kind==="reject"?"What's missing?":"What happened?"}</label><textarea id="note" style="margin-top:8px" placeholder="${a.kind==="reject"?"e.g. The note doesn't mention the echo":"e.g. Spoke to intake, visit booked Nov 17"}"></textarea><div style="margin-top:8px;display:flex;gap:8px"><button class="btn primary" id="saveLog">Save</button><button class="btn link" id="cancelLog">Cancel</button></div></div>`;
    $("#note").focus();
    $("#saveLog").onclick=()=>removeCurrent(a.kind==="reject"?"Sent back: waiting for better proof":"Update saved","waiting");
    $("#cancelLog").onclick=()=>$("#live").innerHTML=""; return;
  }
  removeCurrent(a.done,"done");
}
function bindDivider(){
  const d=$("#divider"); if(!d) return;
  const set=w=>{ w=Math.max(300,Math.min(560,Math.round(w))); prefs.qw=w; document.documentElement.style.setProperty("--queue-w",w+"px"); d.setAttribute("aria-valuenow",w); };
  d.onpointerdown=e=>{ e.preventDefault(); d.classList.add("drag"); d.setPointerCapture(e.pointerId); const left=$("#split").getBoundingClientRect().left;
    d.onpointermove=ev=>set(ev.clientX-left); d.onpointerup=()=>{ d.classList.remove("drag"); d.onpointermove=null; save(); }; };
  d.ondblclick=()=>{ set(380); save(); };
  d.onkeydown=e=>{ if(e.key==="ArrowLeft"){ set((prefs.qw||380)-20); save(); } if(e.key==="ArrowRight"){ set((prefs.qw||380)+20); save(); } };
}

  const step=()=>{ draw(); if(n<lines.length){ n++; callTimer=setTimeout(step,1100);} };
  step(); }
const CMDS=[["Go to Needs you","#/queue"],["Go to Patients","#/patients"],["Add a discharge","#/new"],["Team","#/team"],["Calls and tasks","#/activity/calls"],["Imports","#/activity/imports"],["Identity checks","#/activity/identity"],["Audit log","#/activity/audit"],["Settings: text size","#/settings"]];
let pSel=0, pRes=[];
function openPalette(){ $("#palette").classList.add("show"); $("#scrim").classList.add("show"); $("#pq").value=""; renderPalette(); $("#pq").focus(); }
function renderPalette(){ const q=$("#pq").value.toLowerCase().trim();
  const pts=CASELOAD.filter(id=>!q||(P(id).name+P(id).mrn+P(id).cond).toLowerCase().includes(q)).map(id=>({g:"Patients",l:P(id).name,r:`${P(id).mrn} · ${P(id).cond}`,h:`#/patients/${id}`}));
  const fus=queue.filter(i=>q&&(i.title+P(i.pt).name).toLowerCase().includes(q)).map(i=>({g:"Follow-ups",l:i.title,r:P(i.pt).name,item:i.id}));
  const cmds=CMDS.filter(([l])=>!q||l.toLowerCase().includes(q)).map(([l,h])=>({g:"Go to",l,r:"",h}));
  pRes=[...pts,...fus,...cmds].slice(0,12); pSel=Math.min(pSel,Math.max(0,pRes.length-1));
  let g="", h="";
  pRes.forEach((r,i)=>{ if(r.g!==g){ g=r.g; h+=`<div class="grp">${g}</div>`; } h+=`<div class="r" role="option" aria-selected="${i===pSel}" data-pi="${i}"><span>${r.l}</span><span class="muted small">${r.r}</span></div>`; });
  $("#pres").innerHTML=h||`<div class="grp">No matches. Try a name, MRN like C-10482, or “imports”.</div>`; }
function pickPalette(i){ const r=pRes[i]; if(!r) return; closeAll(); if(r.item){ S.scope="team"; S.qf="all"; S.sel=Math.max(0,visible().findIndex(x=>x.id===r.item)); go("#/queue"); } else go(r.h); }
function userMenu(){ const me=people[S.role==="clinician"?"ap":S.me];
  $("#usermenu").innerHTML=`<div class="who"><b>${me.name}</b><div class="tiny muted">${me.role} · Cardiac step-down</div></div><a href="#/settings" data-stabgo="display">Display and text size</a><a href="#/settings" data-stabgo="notifications">Notifications</a><button data-role="${S.role==="clinician"?"coordinator":"clinician"}">Switch to ${S.role==="clinician"?"coordinator":"physician"} view (demo)</button><a href="#/login">Sign out</a>`;
  $("#usermenu").classList.toggle("show"); }

// ═════════════ Events ═════════════
document.addEventListener("click",e=>{
  const t=e.target.closest("button,[data-jump],[data-i],[data-href],[data-goitem],[data-call-sel],[data-imp],[data-audit],[data-pi],a[data-demo],a[data-stabgo],a[data-anchor]");
  if(!e.target.closest("#usermenu,#userBtn")) $("#usermenu").classList.remove("show");
  if(!t) return; const d=t.dataset;
  if(d.jump!==undefined&&document.getElementById("plRange")){ stopPlay(); setDay(d.jump); return; }
  if(d.demo){ S.role=d.demo; S.me=d.demo==="clinician"?"ap":"jd"; S.scope="mine"; S.qf="all"; S.sel=0; return; }
  if(d.stabgo){ S.settingsTab=d.stabgo; return; }
  if(d.anchor){ e.preventDefault(); document.getElementById(d.anchor)?.scrollIntoView({behavior:"smooth"}); return; }
  if(d.i!==undefined){ S.sel=+d.i; S.mDetail=true; render(); $("#content")?.focus(); return; }
  if(d.back!==undefined){ S.mDetail=false; render(); return; }
  if(d.scope){ S.scope=d.scope; S.sel=0; render(); return; }
  if(d.qf){ S.qf=d.qf; S.sel=0; render(); return; }
  if(d.toggle){ S.open[d.toggle]=!S.open[d.toggle]; render(); return; }
  if(d.act){ act(d.act); return; }
  if(d.snooze){ removeCurrent(`Snoozed until ${d.snooze}`,"waiting"); return; }
  if(d.assign!==undefined){ const it=visible()[S.sel]; if(it){ const was=it.owner; it.owner= it.owner===S.me ? null : S.me; toast(it.owner?"Assigned to you":"Handed off to the team (Unassigned)",false); if(was!==it.owner&&S.scope==="mine"&&!it.owner) S.sel=0; render(); } return; }
  if(d.href){ go(d.href); return; }
  if(d.goitem){ S.scope="team"; S.qf="all"; S.sel=Math.max(0,visible().findIndex(i=>i.id===d.goitem)); go("#/queue"); S.mDetail=true; render(); return; }
  if(d.ptab){ S.patientTab=d.ptab; render(); return; }
  if(d.ptf){ S.ptFilter=d.ptf; render(); return; }
  if(d.call){ callDrawer(d.call); return; }
  if(d.log){ openDrawer(`<button class="close">Close · Esc</button><h2>Log an update</h2><p class="muted" style="margin:6px 0 14px">For ${P(d.log).name}. What a patient or family says is recorded as a report, not as proof.</p><div class="field"><label>Who told you</label><select><option>Patient</option><option>Family or caregiver</option><option>Clinic</option><option>Pharmacy</option></select></div><div class="field" style="margin-top:12px"><label>What they said</label><textarea placeholder="e.g. Home care booked for Nov 17, 10:00"></textarea></div><div style="margin-top:14px;display:flex;gap:8px"><button class="btn primary" data-closetoast="Update saved">Save update</button><button class="btn link close">Cancel</button></div>`); return; }
  if(d.mode){ S.newMode=d.mode; S.newStep=1; render(); return; }
  if(d.nstep){ S.newStep=Math.max(1,Math.min(5,+d.nstep)); render(); $("#content")?.scrollTo(0,0); return; }
  if(d.signup){ S.signupStep=+d.signup; render(); return; }
  if(d.cf){ S.callFilter=d.cf; render(); return; }
  if(d.callSel){ S.callSel=d.callSel; render(); return; }
  if(d.imp){ S.impSel=d.imp; render(); return; }
  if(d.audit!==undefined){ S.auditOpen=S.auditOpen===+d.audit?null:+d.audit; render(); return; }
  if(d.stab){ S.settingsTab=d.stab; render(); return; }
  if(d.pref){ const [k,v]=d.pref.split(":"); prefs[k]=k==="text"?+v:v; save(); applyPrefs(); render(); return; }
  if(d.state){ S.state=d.state; render(); if(d.state==="loading") setTimeout(()=>{ if(S.state==="loading"){ S.state="normal"; render(); } },2500); return; }
  if(d.role){ S.role=d.role; S.me=d.role==="clinician"?"ap":"jd"; S.scope="mine"; S.qf="all"; S.sel=0; go("#/queue"); return; }
  if(d.pi!==undefined){ pickPalette(+d.pi); return; }
  if(d.toast){ toast(d.toast,false); if(d.goto) go(d.goto); return; }
  if(d.closetoast){ closeAll(); toast(d.closetoast,false); return; }
  if(d.idDecide){ const i=queue.findIndex(x=>x.id==="q6"); if(i>=0){ queue.splice(i,1); done.unshift({pt:"michael",title:"Identity check",when:NOW,note:d.idDecide==="merge"?"Merged":"Kept separate"}); } render(); toast(d.idDecide==="merge"?"Records merged. Import ing_0420 continues.":"Kept as separate people. Import ing_0420 continues.",false); return; }
  if(t.id==="undo"){ undo(); return; }
  if(t.id==="menuBtn"){ openDrawer(`${logo()}<div style="height:12px"></div>${navItems(route())}`,true); return; }
  if(t.id==="searchBtn"){ openPalette(); return; }
  if(t.id==="userBtn"){ userMenu(); return; }
  if(t.id==="helpBtn"){ $("#help").classList.add("show"); return; }
  if(t.id==="bellBtn"){ S.scope="team"; S.qf="all"; go("#/queue"); toast("Showing overdue items and results first",false); return; }
  if(t.id==="dismissFirst"||t.id==="firstRun"){ S.firstRun=t.id==="firstRun"; render(); return; }
  if(t.id==="emptyQ"){ queue=[]; go("#/queue"); return; }
  if(t.classList.contains("close")){ closeAll(); return; }
  if(t.id==="endCall"){ closeAll(); toast("Call ended early. It will show as not confirmed.",false); return; }
  if(t.id==="findFU"){ S.newFound=true; render(); return; }
  if(t.id==="createPt"){ toast("Robert Alvarez added with 5 follow-ups",false); S.newFound=false; S.newStep=1; go("#/patients"); return; }
  if(t.id==="pull"){ S.impSel="ing_0421"; toast("Import started for C-10511",false); go("#/activity/imports"); return; }
  if(t.id==="retryImp"){ const j=imports.find(x=>x.id==="ing_0416"); j.steps="✓✓✓✓✓"; j.result="Done · 6 follow-ups"; j.bad=false; j.log[4]=["Check everything saved","09:15:02","6 of 6 found","done"]; j.note="Retried from the failed step only."; const qi=queue.findIndex(x=>x.id==="q7"); if(qi>=0) queue.splice(qi,1); render(); toast("Import finished: 6 of 6 follow-ups saved",false); return; }
});
document.addEventListener("input",e=>{
  const id=e.target.id;
  if(id==="ptSearch"||id==="auditQ"){ S[id==="ptSearch"?"ptSearch":"auditQ"]=e.target.value; render(); const i=$("#"+id); i.focus(); i.setSelectionRange(i.value.length,i.value.length); }
  if(id==="ts"){ prefs.text=+e.target.value; applyPrefs(); $("#tsv").textContent=prefs.text+"%"; save(); }
  if(id==="qw"){ prefs.qw=+e.target.value; applyPrefs(); $("#qwv").textContent=prefs.qw+"px"; save(); }
  if(id==="pq"){ pSel=0; renderPalette(); }
});
document.addEventListener("change",e=>{ if(e.target.id==="auditPt"){ S.auditPt=e.target.value==="All patients"?"all":e.target.value; render(); }
  if(e.target.dataset.assignTo){ const it=queue.find(x=>x.id===e.target.dataset.assignTo); if(it&&e.target.value){ it.owner=e.target.value; toast(`Assigned to ${people[it.owner].name}`,false); render(); } } });
document.addEventListener("submit",e=>{
  if(e.target.id==="chatForm"){ e.preventDefault(); const v=$("#chatIn").value.trim(); if(!v) return; S.chat.push({me:true,t:v},{t:"Still open: home-care assessment (2 days overdue), cardiology (proof in, waiting for a coordinator), blood culture (final Nov 16), family physician (waiting for the clinic record), medication review (Nov 18)."}); render(); $("#chatIn").focus(); }
  if(e.target.id==="loginForm"){ e.preventDefault(); const ok=$("#em").value.includes("@")&&$("#pw").value.length>0; S.authErr=!ok; if(ok){ S.role="coordinator"; go("#/queue"); } else render(); }
});
$("#scrim").onclick=closeAll;
document.addEventListener("keydown",e=>{
  const pal=$("#palette").classList.contains("show");
  if(pal){ if(e.key==="ArrowDown"){ pSel=Math.min(pRes.length-1,pSel+1); renderPalette(); e.preventDefault(); } if(e.key==="ArrowUp"){ pSel=Math.max(0,pSel-1); renderPalette(); e.preventDefault(); } if(e.key==="Enter"){ pickPalette(pSel); e.preventDefault(); } if(e.key==="Escape") closeAll(); return; }
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="k"){ e.preventDefault(); if(!PUBLIC.includes(route()[0])) openPalette(); return; }
  if(e.target.matches("textarea,input,select")){ if(e.key==="Escape") e.target.blur(); return; }
  const k=e.key;
  if(k==="Escape"){ closeAll(); return; }
  if(PUBLIC.includes(route()[0])) return;
  if(k==="/"){ e.preventDefault(); openPalette(); return; }
  if(k==="?"){ $("#help").classList.toggle("show"); return; }
  if(route()[0]!=="queue") return;
  const v=visible();
  if(k==="j"){ S.sel=Math.min(v.length-1,S.sel+1); render(); }
  if(k==="k"){ S.sel=Math.max(0,S.sel-1); render(); }
  if(k==="["||k==="]"){ prefs.qw=Math.max(300,Math.min(560,(prefs.qw||380)+(k==="]"?20:-20))); applyPrefs(); save(); }
  if(k==="Enter"&&!e.target.closest("button,a")){ e.preventDefault(); act("primary"); }
  if(k==="p"&&v[S.sel]) patientDrawer(v[S.sel].pt);
  if(k==="u") undo();
});
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>{ if((prefs.theme||"system")==="system"){ applyPrefs(); } });
render();
</script>
</body>
